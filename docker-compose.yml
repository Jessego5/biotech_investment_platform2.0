# Local stack: Postgres plus the same image running as either the API or the
# ingestion batch. The point of this file is to prove the Postgres path actually
# works before anything gets deployed, since the app has only ever run on SQLite.
#
#   docker compose up api                # build and serve on http://localhost:8000
#   docker compose run --rm ingest       # populate the database, then exit
#
# Running without this file is unchanged: the app still defaults to local SQLite
# when DATABASE_URL isn't set.

services:
  db:
    # Postgres with the vector extension available. plain postgres:16 cannot
    # create it, and the trials table has a vector column, so the schema would
    # fail to create at all.
    image: pgvector/pgvector:pg16
    # Docker gives a container 64 MB of /dev/shm, and Postgres builds an index
    # in parallel through shared memory segments sized from maintenance_work_mem.
    # Building the HNSW index over 334k vectors asks for a gigabyte of it and
    # fails with "No space left on device" pointing at shared memory, not at the
    # disk, which is a confusing way to read a real limit. RDS does not have this
    # problem; only a container does.
    shm_size: 2gb
    environment:
      POSTGRES_USER: biotech
      POSTGRES_PASSWORD: biotech        # local only, never used anywhere real
      POSTGRES_DB: biotech
    # wait until Postgres actually accepts connections, not just until the
    # container starts, so ingestion doesn't race it and fail on first run
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biotech -d biotech"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      args:
        # same passthrough as the environment below. the default is PyPI, so this
        # changes nothing unless PIP_INDEX_URL is set, which is worth doing where
        # PyPI is slow: the install is most of the build time.
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      # the host port is configurable because 8000 is a busy one — another
      # service holding 127.0.0.1:8000 wins over this publish for localhost,
      # and the symptom is the page quietly reading someone else's API.
      # Nothing in the deployed stack uses this; the frontend reaches the API
      # by service name over the compose network.
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://biotech:biotech@db:5432/biotech
      # passed through from your shell or root .env. the app runs without the
      # OpenAI key, it just falls back to the fixed template narrative.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # questions /ask will answer per UTC day, for everyone together. Unset is
      # the default in the code; 0 removes the cap, which is what a local run
      # without an OpenAI key is doing anyway.
      ASK_DAILY_BUDGET: ${ASK_DAILY_BUDGET:-}
      # Shared secret for /ask. Unset, the endpoint stays open, which is what
      # a local run wants; set, only a caller holding it can spend the key
      # above. See app/main.py require_key.
      READBASE_API_KEY: ${READBASE_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      # the API reads the archive as well as writing it: /snapshots, /changes and
      # /company/{ticker}/changes all answer out of it. Without this the archive
      # is only visible to the ingest container, and those three endpoints return
      # empty in a way that looks like "nothing has changed" rather than "this
      # process cannot see the history".
      RAW_DIR: /snapshots
    volumes:
      # read-only: the API answers from the archive and must never write to it.
      # Only ingestion adds a snapshot, and only on a dated key it has not used.
      - snapshots:/snapshots:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    # The frontend, from the image the serving stack ships. Here for the same
    # reason the API is: so the thing that gets deployed is the thing that was
    # run, rather than a dev server that resembles it.
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      # the service name, not localhost. Every call the browser makes goes to
      # the frontend's own route handlers, which reach the API from in here.
      READBASE_API_URL: http://api:8000
      # must match the API's. Unset on both, /ask stays open, which is what a
      # local run wants.
      READBASE_API_KEY: ${READBASE_API_KEY:-}
    depends_on:
      api:
        condition: service_started

  # the same image with a different command. not started by `docker compose up`,
  # since ingestion is a batch job you run on purpose, not a service.
  ingest:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    command: python ingest.py
    profiles: ["batch"]
    environment:
      DATABASE_URL: postgresql+psycopg://biotech:biotech@db:5432/biotech
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      # fewer parallel fetches than the laptop default of eight. Each worker can
      # hold a sponsor's whole response — up to a thousand studies — while it
      # archives and parses it, and eight at once was killed by the OOM reaper at
      # company 53 of 787 in a 3.8 GB VM that was also running Postgres.
      INGEST_WORKERS: ${INGEST_WORKERS:-3}
      # write snapshots to the mounted volume below. without this they would go
      # to a path inside the container and be discarded when it exits, which is
      # the one thing here that cannot be rebuilt: re-running ingestion gets
      # today's data, never last month's. set RAW_BUCKET instead to use S3.
      RAW_DIR: /snapshots
    volumes:
      - snapshots:/snapshots
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  # the snapshot archive, kept outside the container for the same reason the
  # database is: a batch job that exits should not take its output with it
  snapshots:
